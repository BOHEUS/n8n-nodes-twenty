version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @n8n/node-cli's lint rules crash on both; drop these once it supports them.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
